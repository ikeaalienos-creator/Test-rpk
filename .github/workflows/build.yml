name: Build RPK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build RPK
        run: npm run build

      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-test
          path: dist/*.rpk
